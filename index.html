<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Llife</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Nanum+Gothic+Coding:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

<!-- 순서 중요: 데이터 → 배경·아바타 → 엔진 → 화면 -->
<script defer src="data/weather.js"></script>
<script defer src="data/life.js"></script>
<script defer src="data/school.js"></script>
<script defer src="data/jobs.js"></script>
<script defer src="data/social.js"></script>
<script defer src="data/dialogues.js"></script>
<script defer src="data/crime.js"></script>
<script defer src="data/events.js"></script>
<script defer src="data/events2.js"></script>
<script defer src="data/freshman.js"></script>
<script defer src="data/lecture.js"></script>
<script defer src="data/career.js"></script>
<script defer src="data/story.js"></script>
<script defer src="data/quick.js"></script>
<script defer src="data/places.js"></script>
<script defer src="data/encounter.js"></script>
<script defer src="data/region.js"></script>
<script defer src="data/map.js"></script>
<script defer src="data/housing.js"></script>
<script defer src="data/realty.js"></script>
<script defer src="data/food.js"></script>
<script defer src="data/acts.js"></script>
<script defer src="js/weather.js"></script>
<script defer src="js/scenes.js"></script>
<script defer src="js/act.js"></script>
<script defer src="js/citymap.js"></script>
<script defer src="js/face.js"></script>
<script defer src="js/outfit.js"></script>
<script defer src="js/avatar.js"></script>
<script defer src="js/game.js"></script>
<script defer src="js/night.js"></script>
<script defer src="js/main.js"></script>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div id="backdrop" aria-hidden="true"></div>

<main class="app" id="app">
  <header class="hud panel">
    <div class="who">
      <!-- 프로필 원: 누르면 내 정보(능력치·상태·기록 수치 전부) -->
      <button type="button" class="me-av" id="meAv" aria-label="내 정보 — 능력치·기록"><svg viewBox="0 0 64 64" aria-hidden="true"><defs><clipPath id="meAvClip"><circle cx="32" cy="32" r="32"/></clipPath></defs><g clip-path="url(#meAvClip)"><rect width="64" height="64" fill="#dfe2e8"/><circle cx="32" cy="25" r="11.5" fill="#9aa1ac"/><path d="M7 68c0-15 11-25.5 25-25.5S57 53 57 68z" fill="#9aa1ac"/></g></svg></button>
      <div class="who-t">
        <div class="who-n"><span id="name"></span><span id="age"></span><span id="gender" class="dim"></span></div>
        <div class="sub"><span id="role"></span><span id="trait"></span><span id="money"></span></div>
      </div>
      <span class="tools">
        <button type="button" id="slotsBtn" aria-label="저장 칸">💾</button>
        <button type="button" id="restart" aria-label="새 인생">↻</button>
        <button type="button" id="hide" aria-label="배경만 보기">👁</button>
      </span>
    </div>
    <!-- 홈 화면엔 행복·건강·성욕만. 능력치·기록은 프로필 원을 눌러서 -->
    <div class="conds" id="conds"></div>
  </header>

  <section class="log panel" id="log" aria-label="인생 기록"></section>

  <section class="controls panel" aria-label="행동">
    <div class="season-row"><span id="season"></span><span class="dots" id="ap" aria-hidden="true"></span><span class="dim" id="apNum"></span></div>
    <div class="flow" id="flow" hidden></div>
    <div class="where" id="where"></div>
  </section>
</main>

<!-- 아래 탭바: 📱 폰(연락처·관계망·부동산·배달·구인·은행·지도·앨범) · 🗺️ 지도 · 🎒 가방(먹을 것) · 🕶 범죄 · 큰 버튼(계속·다음 주·잠자기) -->
<nav class="tabbar" id="tabbar" aria-label="메뉴">
  <button type="button" id="phoneBtn"><span class="ti">📱</span><span>폰</span></button>
  <button type="button" id="mapBtn"><span class="ti">🗺️</span><span>지도</span></button>
  <button type="button" id="bagBtn"><span class="ti">🎒</span><span>가방</span></button>
  <button type="button" id="crimeBtn"><span class="ti">🕶</span><span>범죄</span></button>
  <button type="button" class="age-btn" id="ageUp">▶ 계속</button>
</nav>

<div class="modal-wrap" id="modal" hidden>
  <div class="modal panel" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="ph-status" id="phStatus" aria-hidden="true"></div>
    <div class="m-head"><button type="button" class="m-back" id="mBack" aria-label="뒤로" hidden>‹</button><span id="mTitle"></span><button type="button" id="mClose" aria-label="닫기">✕</button></div>
    <div class="m-body" id="mBody"></div>
  </div>
</div>

<!-- 연출: 함께 밤을 보낸 뒤(맞물림 → 페이드 → 다음 날 아침), 키스·포옹·끌어당기기, 임신 -->
<div class="scene-wrap" id="scene" hidden><div class="scene" id="sceneBox" role="dialog" aria-modal="true" aria-label="연출"></div></div>

<div class="show-wrap" id="showWrap" hidden>
  <button type="button" class="show-btn" id="show" aria-label="화면 다시 보기">👁</button>
</div>
</body>
</html>
