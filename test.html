<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>아바타 체형 테스트</title>
<style>
  :root { --bg: #f4f1ea; --card: #fff; --text: #2b2420; --dim: #8a8078; --ok: #2f8a4a; --bad: #c8323c; --line: #ddd5c8; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--text); font: 13px/1.5 system-ui, sans-serif; }
  h1 { font-size: 17px; margin: 0 0 4px; }
  .dim { color: var(--dim); }
  .bar { display: flex; gap: 16px; align-items: center; margin: 8px 0 14px; flex-wrap: wrap; }
  .checks { display: grid; grid-template-columns: auto auto auto auto; gap: 2px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; margin-bottom: 14px; width: max-content; max-width: 100%; }
  .checks b { font-weight: 600; }
  .ok { color: var(--ok); } .bad { color: var(--bad); font-weight: 700; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; margin-bottom: 12px; }
  section h2 { font-size: 13.5px; margin: 0 0 6px; }
  .row { display: flex; gap: 6px; overflow-x: auto; align-items: flex-end; }
  .fig { display: grid; justify-items: center; gap: 2px; min-width: 124px; }
  .fig .lab { font-weight: 600; }
  .fig .num { font-size: 11px; color: var(--dim); text-align: center; white-space: pre; line-height: 1.35; }
  .av-bg { fill: #fbfaf7; stroke: #e6dfd3; }
</style>
</head>
<body>
<h1>아바타 체형 테스트 시트</h1>
<p class="dim">같은 틀(0 0 120 280)·같은 바닥선·같은 cm당 px. 한 줄에서 한 항목만 바꿈. 아래 숫자는 앵커 폭(px, 전체 폭). 콘솔에 줄마다 표가 찍힘.</p>
<div class="bar"><label><input type="checkbox" id="guides" checked> 앵커·바닥 가이드</label></div>
<div class="checks" id="checks"></div>
<div id="rows"></div>
<div id="faces"></div>
<div id="hcb"></div>
<script src="js/face.js"></script>
<script src="js/outfit.js"></script>
<script src="js/avatar.js"></script>
<script>
const A = window.Avatar;
const base = (seed, g, top, tc) => Object.assign(A.make(seed, g), { top, tc, glasses: 0, body: g === 'f' ? { height: 'avg', build: 'avg', chest: 'avg' } : { height: 'avg', build: 'avg', shoulder: 'avg' } });
const F0 = base('test-f', 'f', 0, 0), M0 = base('test-m', 'm', 0, 5);
const fF = o => Object.assign({ height: 165, waist: 64, hip: 92, cup: 'C' }, o);
const fM = o => Object.assign({ height: 178, shoulder: 44 }, o);
const ROWS = [
  { id: 'cup', t: '줄 1 · 여 165cm, 허리 64, 골반 92 — 컵', items: ['A', 'C', 'E', 'F'].map(c => ({ lab: c + '컵', a: F0, fig: fF({ cup: c }) })) },
  { id: 'hip', t: '줄 2 · 여 165cm, 허리 64, 컵 C — 골반', items: [82, 92, 104].map(v => ({ lab: '골반 ' + v, a: F0, fig: fF({ hip: v }) })) },
  { id: 'waist', t: '줄 3 · 여 165cm, 골반 92, 컵 C — 허리', items: [57, 64, 74].map(v => ({ lab: '허리 ' + v, a: F0, fig: fF({ waist: v }) })) },
  { id: 'height', t: '줄 4 · 여 컵 C — 키', items: [150, 160, 170, 175].map(v => ({ lab: v + 'cm', a: F0, fig: fF({ height: v }) })) },
  { id: 'shoulder', t: '줄 5 · 남 178cm — 어깨', items: [39, 44, 50].map(v => ({ lab: '어깨 ' + v, a: M0, fig: fM({ shoulder: v }) })) },
  { id: 'mwaist', t: '줄 6 · 남 178cm — 허리 (88 이상은 통통 규칙 자동)', items: [72, 82, 92].map(v => ({ lab: '허리 ' + v, a: M0, fig: fM({ waist: v }) })) },
  { id: 'top', t: '줄 7 · 같은 여성 체형 — 윗옷 여유분 (티 1 / 니트 3 / 후디 5 / 셔츠 2)', items: [[0, 0, '티'], [3, 0, '니트'], [2, 1, '후디'], [1, 2, '셔츠']].map(([top, tc, lab]) => ({ lab, a: base('test-f', 'f', top, tc), fig: fF({ cup: 'D' }) })) },
  { id: 'age', t: '줄 8 · 나이 — 등신 변화 (어린이 1:3.5 → 어른 1:5.5)', items: [6, 10, 14, 17, 25].map(age => ({ lab: age + '살', a: F0, age, fig: age >= 20 ? fF({}) : null })) },
  { id: 'pose', t: '줄 9 · 자세 — 기본 / 허리 손 / 팔짱 (팔짱은 밑가슴 +2px, 가슴에 밀려 바깥으로)', items: [['default', 'f'], ['hip', 'f'], ['cross', 'f'], ['default', 'm'], ['hip', 'm'], ['cross', 'm']].map(([pose, g]) => ({ lab: (g === 'f' ? '여 E ' : '남 ') + { default: '기본', hip: '허리 손', cross: '팔짱' }[pose], a: g === 'f' ? F0 : M0, pose, fig: g === 'f' ? fF({ cup: 'E' }) : fM({}) })) },
];
// 섹션 3 기준: 한 항목만 바꿨을 때 앵커 폭 차이가 이만큼은 나야 함
const CHECKS = [
  { row: 'cup', from: 0, to: 2, key: 'bust', min: 6, t: 'A컵 vs E컵 → 가슴' },
  { row: 'hip', from: 0, to: 2, key: 'hip', min: 10, t: '골반 82 vs 104 → 골반' },
  { row: 'waist', from: 0, to: 2, key: 'waist', min: 8, t: '허리 57 vs 74 → 허리' },
  { row: 'shoulder', from: 0, to: 2, key: 'shoulder', min: 10, t: '어깨 39 vs 50 (남) → 어깨' },
  { row: 'height', from: 0, to: 2, key: 'height', min: 26, t: '키 150 vs 170 → 전체 높이' },
];
const r1 = v => Math.round(v * 10) / 10;
function draw() {
  const guides = document.getElementById('guides').checked, px = {};
  document.getElementById('rows').innerHTML = ROWS.map(row => {
    const table = {};
    const figs = row.items.map(it => {
      const age = it.age ?? 25, an = A.anchors(it.a, age, it.fig), p = an.px;
      (px[row.id] = px[row.id] || []).push(p);
      table[it.lab] = { 키: r1(p.height), 어깨: r1(p.shoulder), 가슴: r1(p.bust), 밑가슴: r1(p.underbust), 허리: r1(p.waist), 골반: r1(p.hip), 허벅지: r1(p.thigh) };
      const num = `가슴 ${r1(p.bust)} · 허리 ${r1(p.waist)}\n골반 ${r1(p.hip)} · 어깨 ${r1(p.shoulder)}\n키 ${r1(p.height)}px`;
      return `<div class="fig">${A.render(it.a, 120, { age, full: it.fig || true, pose: it.pose || 'default', guides })}<span class="lab">${it.lab}</span><span class="num">${num}</span></div>`;
    }).join('');
    console.log(row.t); console.table(table);
    return `<section><h2>${row.t}</h2><div class="row">${figs}</div></section>`;
  }).join('');
  document.getElementById('checks').innerHTML = '<b>검사</b><b>차이</b><b>기준</b><b>결과</b>' + CHECKS.map(c => {
    const d = Math.abs(px[c.row][c.to][c.key] - px[c.row][c.from][c.key]), ok = d >= c.min;
    if (!ok) console.warn('미달:', c.t, r1(d), '<', c.min);
    return `<span>${c.t}</span><span>${r1(d)}px</span><span>${c.min}px 이상</span><span class="${ok ? 'ok' : 'bad'}">${ok ? '통과' : '미달'}</span>`;
  }).join('');
}
document.getElementById('guides').addEventListener('change', draw);
draw();

// ── 얼굴 다양성 (FACE_VARIETY.md §12) ──
// 1. 머리·옷 가림: 같은 대머리 + 같은 회색 상의 + 같은 피부로 24명 → 비슷한 얼굴 쌍이 없어야 함 (faceDistance 최솟값, 3 미만이면 경고)
// 2. 같은 사람 일관성: 썸네일 / 상반신 / 전신 / 표정 7종
// 3. 같은 시드 남·녀: 남매처럼 닮았지만 머리 없이도 성별이 구분돼야 함
function drawFaces() {
  const box = document.getElementById('faces'), cell = (svg, lab) => `<div class="fig">${svg}<span class="lab">${lab}</span></div>`;
  const P = [];
  for (let i = 0; i < 24; i++) { const a = A.make('face-' + i, i % 2 ? 'f' : 'm'); a.skin = 1; P.push(a); }
  let min = 99, pair = '';
  for (let i = 0; i < P.length; i++) for (let j = i + 1; j < P.length; j++) { const d = A.faceDistance(P[i], P[j]); if (d < min) { min = d; pair = `${i}·${j}`; } }
  const row1 = P.map((a, i) => cell(A.render(a, 96, { age: 26, mask: true }), `${i} ${(A.genes(a).arch && Face.ARCH[A.genes(a).arch].label) || Face.SHAPE_LABEL[A.genes(a).shape]}`)).join('');
  const who = A.make('face-same', 'f');
  const EX = [['neutral', '기본'], ['smile', '미소'], ['laugh', '웃음'], ['sad', '슬픔'], ['angry', '화남'], ['surprised', '놀람'], ['shy', '수줍음']];
  const row2 = cell(A.render(who, 40, { age: 26 }), '썸네일') + cell(A.render(who, 120, { age: 26 }), '상반신') + cell(A.render(who, 100, { age: 26, full: true }), '전신')
    + EX.map(([x, l]) => cell(A.render(who, 96, { age: 26, expr: x === 'neutral' ? null : x }), l)).join('');
  const row3 = [0, 1, 2, 3, 4, 5].map(i => { const m = A.make('sib-' + i, 'm'), f = A.make('sib-' + i, 'f'); m.skin = f.skin = 1; return cell(A.render(m, 80, { age: 24, mask: true }), `시드 ${i} 남`) + cell(A.render(f, 80, { age: 24, mask: true }), `시드 ${i} 여`); }).join('');
  if (min < 3) console.warn('비슷한 얼굴:', pair, min.toFixed(2)); else console.log('24명 faceDistance 최솟값', min.toFixed(2), pair);
  box.innerHTML = `<section><h2>얼굴 1 · 머리·옷 가림 24명 — faceDistance 최솟값 <b class="${min < 3 ? 'bad' : 'ok'}">${min.toFixed(2)}</b> (${pair}, 3 미만이면 경고)</h2><div class="row" style="flex-wrap:wrap">${row1}</div></section>`
    + `<section><h2>얼굴 2 · 같은 사람 — 썸네일 / 상반신 / 전신 / 표정 7종</h2><div class="row" style="flex-wrap:wrap">${row2}</div></section>`
    + `<section><h2>얼굴 3 · 같은 시드 남·녀 (머리 없이)</h2><div class="row" style="flex-wrap:wrap">${row3}</div></section>`;
}
drawFaces();

// ── 체형·머리·옷 (HAIR_CLOTHES_BODY.md 테스트 시트) ──
// 1. 같은 얼굴·같은 옷으로 build 4종 × 남녀 = 8명 (체형이 구분되는지)
// 2. 같은 얼굴·같은 체형으로 머리 스타일 32종 (실루엣만 봐도 구분되는지) + 앞머리 9종
// 3. 한 NPC의 사계절 + 출근 + 데이트 + 잠옷 = 7벌 (같은 사람으로 보이는지)
function drawHCB() {
  const box = document.getElementById('hcb'), cell = (svg, lab) => `<div class="fig">${svg}<span class="lab">${lab}</span></div>`, O = window.Outfit;
  const same = g => ({ inner: { k: 'tee', c: '#8d8d92' }, bottom: { k: 'jeans', c: O.N.denim, cut: 'straight' }, shoes: { k: 'sneaker', c: O.N.white }, acc: {} });
  const BL = { slim: '마름', avg: '보통', fit: '근육', chubby: '통통' };
  const row1 = ['f', 'm'].flatMap(g => Object.keys(BL).map(b => { const a = A.make('hcb-' + g, g); a.body = Object.assign({}, a.body, { build: b }); a.hacc = null; return cell(A.render(a, 96, { age: 27, full: true, outfit: same(g), pose: 'default' }), `${g === 'f' ? '여' : '남'} ${BL[b]}`); })).join('');
  const row2 = ['f', 'm'].flatMap(g => A.parts.hair[g].map((lab, i) => { const a = A.make('hcb-h' + g, g); a.hair = i; a.hv = 2; a.hc = 1; a.hacc = null; return cell(A.render(a, 64, { age: 26 }), `${g === 'f' ? '여' : '남'} ${lab}`); })).join('')
    + A.parts.front.map(f => { const a = A.make('hcb-hf', 'f'); a.hair = 0; a.hv = 2; a.hc = 1; a.front = f.id; a.hacc = null; return cell(A.render(a, 64, { age: 26 }), f.label); }).join('');
  const who = { personality: 'warm', hobby: 'fashion', job: '회사원', styleG: 3 }, npc = A.make('hcb-npc', 'f', who);
  const CT = [['봄', { season: 'spring', dayN: 3 }], ['여름', { season: 'summer', dayN: 4 }], ['가을', { season: 'fall', dayN: 5 }], ['겨울', { season: 'winter', dayN: 6 }], ['출근', { season: 'spring', working: true, dayN: 7 }], ['데이트', { season: 'fall', event: 'date', dayN: 8 }], ['잠옷', { season: 'fall', home: true, hour: 23, dayN: 9 }]];
  const row3 = CT.map(([lab, c]) => { const ctx = Object.assign({ who }, c); return cell(A.render(npc, 96, { age: 29, full: true, ctx, personality: who.personality }), `${lab}<br><span class="num">${O.describe(O.pick(npc, 29, ctx))}</span>`); }).join('');
  box.innerHTML = `<section><h2>체형 1 · 같은 얼굴·같은 옷 — build 4종 × 남녀</h2><div class="row" style="flex-wrap:wrap">${row1}</div></section>`
    + `<section><h2>머리 · 같은 얼굴 — 스타일 여 18 · 남 14 + 앞머리 9종</h2><div class="row" style="flex-wrap:wrap">${row2}</div></section>`
    + `<section><h2>옷 · 한 사람의 사계절 + 출근 + 데이트 + 잠옷</h2><div class="row" style="flex-wrap:wrap">${row3}</div></section>`;
}
drawHCB();
</script>
</body>
</html>
